<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif">
<rect width="1600" height="900" fill="#FFFFFF"/>
<defs>
  <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0084D6"/></marker>
  <marker id="flg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker>
  <filter id="sombra" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#243673" flood-opacity="0.13"/>
  </filter>
</defs>
<rect x="150" y="24" width="1230" height="96" rx="16" fill="#D1FAE5" stroke="#059669" stroke-width="2" filter="url(#sombra)"/>
<circle cx="196" cy="70" r="23" fill="#059669"/>
<text x="196" y="79" text-anchor="middle" font-size="25" font-weight="700" fill="#FFFFFF">1</text>
<text x="238" y="64" font-size="27" font-weight="700" fill="#243673" letter-spacing="0.4">USUARIOS</text>
<text x="238" y="98" font-size="21" fill="#1D2433">Administración, operarios y jefe de producción. Piden lo que necesitan en su propio idioma, hablando o escribiendo.</text>
<text x="1360" y="56" text-anchor="end" font-size="17" font-weight="700" fill="#059669" letter-spacing="1.1">FUNCIONA HOY</text>
<path d="M765.0,122 L765.0,134" stroke="#94A3B8" stroke-width="3" marker-end="url(#fl)"/>
<rect x="150" y="136" width="1230" height="96" rx="16" fill="#D1FAE5" stroke="#059669" stroke-width="2" filter="url(#sombra)"/>
<circle cx="196" cy="182" r="23" fill="#059669"/>
<text x="196" y="191" text-anchor="middle" font-size="25" font-weight="700" fill="#FFFFFF">2</text>
<text x="238" y="176" font-size="27" font-weight="700" fill="#243673" letter-spacing="0.4">WIDGET CONVERSACIONAL</text>
<text x="238" y="210" font-size="21" fill="#1D2433">Vive dentro del ERP. Captura la consulta, muestra la confirmación y devuelve la respuesta.</text>
<text x="1360" y="168" text-anchor="end" font-size="17" font-weight="700" fill="#059669" letter-spacing="1.1">FUNCIONA HOY</text>
<path d="M765.0,234 L765.0,246" stroke="#94A3B8" stroke-width="3" marker-end="url(#fl)"/>
<rect x="150" y="248" width="1230" height="96" rx="16" fill="#FEF3C7" stroke="#B45309" stroke-width="2" filter="url(#sombra)"/>
<circle cx="196" cy="294" r="23" fill="#B45309"/>
<text x="196" y="303" text-anchor="middle" font-size="25" font-weight="700" fill="#FFFFFF">3</text>
<text x="238" y="288" font-size="27" font-weight="700" fill="#243673" letter-spacing="0.4">SPEECH-TO-TEXT</text>
<text x="238" y="322" font-size="21" fill="#1D2433">Convierte el audio en texto. Si el ruido de planta lo impide, queda la alternativa escrita.</text>
<text x="1360" y="280" text-anchor="end" font-size="17" font-weight="700" fill="#B45309" letter-spacing="1.1">SIMULADO</text>
<path d="M765.0,346 L765.0,358" stroke="#94A3B8" stroke-width="3" marker-end="url(#fl)"/>
<rect x="150" y="360" width="1230" height="96" rx="16" fill="#FEF3C7" stroke="#B45309" stroke-width="2" filter="url(#sombra)"/>
<circle cx="196" cy="406" r="23" fill="#B45309"/>
<text x="196" y="415" text-anchor="middle" font-size="25" font-weight="700" fill="#FFFFFF">4</text>
<text x="238" y="400" font-size="27" font-weight="700" fill="#243673" letter-spacing="0.4">MODELO DE IA GENERATIVA</text>
<text x="238" y="434" font-size="21" fill="#1D2433">Entiende qué se pidió y elige la herramienta. No accede a la base ni ejecuta SQL.</text>
<text x="1360" y="392" text-anchor="end" font-size="17" font-weight="700" fill="#B45309" letter-spacing="1.1">SIMULADO</text>
<path d="M765.0,458 L765.0,470" stroke="#94A3B8" stroke-width="3" marker-end="url(#fl)"/>
<rect x="150" y="472" width="1230" height="180" rx="16" fill="#FEF3C7" stroke="#0084D6" stroke-width="4" filter="url(#sombra)"/>
<circle cx="196" cy="518" r="23" fill="#243673"/>
<text x="196" y="527" text-anchor="middle" font-size="25" font-weight="700" fill="#FFFFFF">5</text>
<text x="238" y="512" font-size="30" font-weight="700" fill="#243673" letter-spacing="0.4">MIDDLEWARE · FastAPI</text>
<text x="238" y="546" font-size="21" fill="#1D2433">DECIDE. Es la única vía de escritura: nada se guarda sin pasar por acá.</text>
<rect x="238" y="576" width="121" height="44" rx="22" fill="#FFFFFF" stroke="#0084D6" stroke-width="1.6"/>
<text x="298" y="605" text-anchor="middle" font-size="19" font-weight="600" fill="#243673">Identidad</text>
<rect x="371" y="576" width="199" height="44" rx="22" fill="#FFFFFF" stroke="#0084D6" stroke-width="1.6"/>
<text x="470" y="605" text-anchor="middle" font-size="19" font-weight="600" fill="#243673">Permisos por rol</text>
<rect x="582" y="576" width="210" height="44" rx="22" fill="#FFFFFF" stroke="#0084D6" stroke-width="1.6"/>
<text x="687" y="605" text-anchor="middle" font-size="19" font-weight="600" fill="#243673">Reglas de negocio</text>
<rect x="804" y="576" width="154" height="44" rx="22" fill="#FFFFFF" stroke="#0084D6" stroke-width="1.6"/>
<text x="882" y="605" text-anchor="middle" font-size="19" font-weight="600" fill="#243673">Confirmación</text>
<rect x="971" y="576" width="121" height="44" rx="22" fill="#FFFFFF" stroke="#0084D6" stroke-width="1.6"/>
<text x="1031" y="605" text-anchor="middle" font-size="19" font-weight="600" fill="#243673">Auditoría</text>
<text x="1360" y="504" text-anchor="end" font-size="17" font-weight="700" fill="#B45309" letter-spacing="1.1">SIMULADO</text>
<path d="M765.0,654 L765.0,666" stroke="#94A3B8" stroke-width="3" marker-end="url(#fl)"/>
<rect x="150" y="668" width="1230" height="96" rx="16" fill="#E8EDF5" stroke="#64748B" stroke-width="2" filter="url(#sombra)"/>
<circle cx="196" cy="714" r="23" fill="#64748B"/>
<text x="196" y="723" text-anchor="middle" font-size="25" font-weight="700" fill="#FFFFFF">6</text>
<text x="238" y="708" font-size="27" font-weight="700" fill="#243673" letter-spacing="0.4">CONECTOR REST</text>
<text x="238" y="742" font-size="21" fill="#1D2433">Traduce la herramienta elegida en una llamada a la API del ERP.</text>
<text x="1360" y="700" text-anchor="end" font-size="17" font-weight="700" fill="#64748B" letter-spacing="1.1">NO IMPLEMENTADO</text>
<path d="M765.0,766 L765.0,778" stroke="#94A3B8" stroke-width="3" marker-end="url(#fl)"/>
<rect x="150" y="780" width="1230" height="96" rx="16" fill="#E8EDF5" stroke="#64748B" stroke-width="2" filter="url(#sombra)"/>
<circle cx="196" cy="826" r="23" fill="#64748B"/>
<text x="196" y="835" text-anchor="middle" font-size="25" font-weight="700" fill="#FFFFFF">7</text>
<text x="238" y="820" font-size="27" font-weight="700" fill="#243673" letter-spacing="0.4">ERP SaaS · Odoo</text>
<text x="238" y="854" font-size="21" fill="#1D2433">EJECUTA y persiste. Dueño de los datos, de sus reglas y del catálogo de etapas.</text>
<text x="1360" y="812" text-anchor="end" font-size="17" font-weight="700" fill="#64748B" letter-spacing="1.1">NO IMPLEMENTADO</text>
<path d="M1438,72.0 L1438,828.0" stroke="#0084D6" stroke-width="4" marker-end="url(#fl)"/>
<path d="M1484,828.0 L1484,72.0" stroke="#94A3B8" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#flg)"/>
<text x="1426" y="450.0" text-anchor="middle" font-size="20" font-weight="700" fill="#0084D6" letter-spacing="2.5" transform="rotate(-90 1426 450.0)">IDA</text>
<text x="1508" y="450.0" text-anchor="middle" font-size="20" font-weight="700" fill="#64748B" letter-spacing="2.5" transform="rotate(90 1508 450.0)">VUELTA</text>
<text x="76" y="408.0" text-anchor="middle" font-size="27" font-weight="700" fill="#0084D6" letter-spacing="2" transform="rotate(-90 76 408.0)">ENTIENDE</text>
<path d="M106,366.0 L106,450.0" stroke="#0084D6" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
<text x="76" y="562.0" text-anchor="middle" font-size="27" font-weight="700" fill="#0084D6" letter-spacing="2" transform="rotate(-90 76 562.0)">DECIDE</text>
<path d="M106,520.0 L106,604.0" stroke="#0084D6" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
<text x="76" y="828.0" text-anchor="middle" font-size="27" font-weight="700" fill="#0084D6" letter-spacing="2" transform="rotate(-90 76 828.0)">EJECUTA</text>
<path d="M106,786.0 L106,870.0" stroke="#0084D6" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
</svg>